[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["data", "docs", "n8n", "web"]

[tool.ruff.lint]
# E4/E7/E9 + F: pyflakes and the pycodestyle errors that catch real bugs.
# I: import sorting. B: common footguns (mutable defaults, unused loop vars).
# UP: outdated syntax for the targeted Python version.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts bootstrap sys.path before importing the package.
"src/scripts/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["autobots"]
